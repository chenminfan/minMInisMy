name: tags
on:
  push:
    tags:
      - "vTags[0-9]_*"

jobs:
  # Build job
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_APP_PREVIEW_LAN_IP: ${{ secrets.VITE_APP_PREVIEW_LAN_IP }}
      VITE_APP_PREVIEW_MOBILE_IP: ${{ secrets.VITE_APP_PREVIEW_MOBILE_IP }}
      VITE_APP_PREVIEW_RESTRICT: "true"
      VITE_APP_FIREBASE_APP_ID: ${{ secrets.VITE_APP_FIREBASE_APP_ID }}
      VITE_APP_FIREBASE_DB_URL: ${{ secrets.VITE_APP_FIREBASE_DB_URL }}
      VITE_APP_FIREBASE_DOMAIN: ${{ secrets.VITE_APP_FIREBASE_DOMAIN }}
      VITE_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_APP_FIREBASE_MEASUREMENT_ID }}
      VITE_APP_FIREBASE_MESSAGING: ${{ secrets.VITE_APP_FIREBASE_MESSAGING }}
      VITE_APP_FIREBASE_PROJECT: ${{ secrets.VITE_APP_FIREBASE_PROJECT }}
      VITE_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_APP_FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 16.x
      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: gh-pages
          folder: build
